name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# Пуш в main обновляет две страницы GitHub Release: NeoForge и Fabric 1.21.1.
# McnCDN из репозитория мода не публикуется.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          set -euo pipefail
          prop() { grep -E "^$1=" gradle.properties | cut -d= -f2- | tr -d '\r'; }
          echo "mod_version=$(prop mod_version)" >> "$GITHUB_OUTPUT"
          echo "kff_version=$(prop kff_version)" >> "$GITHUB_OUTPUT"
          echo "fabric_api_version=$(prop fabric_api_version)" >> "$GITHUB_OUTPUT"
          echo "fabric_kotlin_version=$(prop fabric_kotlin_version)" >> "$GITHUB_OUTPUT"

      - name: Check tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "v${{ steps.versions.outputs.mod_version }}"

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build and test
        run: gradle build --stacktrace

      - name: Collect jars
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ver="${{ steps.versions.outputs.mod_version }}"
          cp -v "build/libs/modsmemoryviewer-neoforge-1.21.1-${ver}.jar" release-assets/
          fabric_jars=(fabric/build/libs/modsmemoryviewer-fabric-*.jar)
          for jar in "${fabric_jars[@]}"; do
            case "${jar}" in
              *-sources.jar|*-dev.jar) continue ;;
              *) cp -v "${jar}" release-assets/ ;;
            esac
          done
          test -f "release-assets/modsmemoryviewer-fabric-1.21.1-${ver}.jar"
          chmod +x .github/scripts/fetch-companion-jars.sh
          .github/scripts/fetch-companion-jars.sh \
            release-assets \
            "${{ steps.versions.outputs.kff_version }}" \
            "${{ steps.versions.outputs.fabric_api_version }}" \
            "${{ steps.versions.outputs.fabric_kotlin_version }}"

      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_TAG: v${{ steps.versions.outputs.mod_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf release-split
          mkdir -p release-split/minecraft-1.21.1-neoforge release-split/minecraft-1.21.1-fabric
          printf '%s\n' "mods memory viewer for minecraft 1.21.1 neoforge" > release-split/minecraft-1.21.1-neoforge/title.txt
          printf '%s\n' "Minecraft **1.21.1** / NeoForge. The mod jar and Kotlin for Forge are required. The key starts unbound; use \`/modsmemory\`. \`all-jars.zip\` contains every jar on this page." > release-split/minecraft-1.21.1-neoforge/body.md
          cp -v release-assets/modsmemoryviewer-neoforge-*.jar release-assets/kotlinforforge-*.jar release-split/minecraft-1.21.1-neoforge/
          printf '%s\n' "mods memory viewer for minecraft 1.21.1 fabric" > release-split/minecraft-1.21.1-fabric/title.txt
          printf '%s\n' "Minecraft **1.21.1** / Fabric. The mod is client-only. Fabric API and Fabric Language Kotlin are required. The key starts unbound; use \`/modsmemory\`. \`all-jars.zip\` contains every jar on this page." > release-split/minecraft-1.21.1-fabric/body.md
          cp -v release-assets/modsmemoryviewer-fabric-*.jar release-assets/fabric-api-*.jar release-assets/fabric-language-kotlin-*.jar release-split/minecraft-1.21.1-fabric/
          python3 .github/scripts/publish-split-releases.py release-split

      - name: Check Modrinth token
        id: modrinth_token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Replace Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          python3 .github/scripts/replace-modrinth-versions.py \
            mods-memory-viewer \
            "${{ steps.versions.outputs.mod_version }}" \
            "${{ steps.versions.outputs.mod_version }}-fabric"

      - name: Publish Modrinth NeoForge
        if: steps.modrinth_token.outputs.present == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mods-memory-viewer
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }}
          version: ${{ steps.versions.outputs.mod_version }}
          version-type: release
          changelog: NeoForge 1.21.1. Client memory screen. Command /modsmemory.
          loaders: neoforge
          environment: client
          game-versions: "1.21.1"
          java: "21"
          files: build/libs/modsmemoryviewer-neoforge-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            kotlin-for-forge(required){modrinth:ordsPcFz}

      - name: Publish Modrinth Fabric
        if: steps.modrinth_token.outputs.present == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mods-memory-viewer
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: ${{ steps.versions.outputs.mod_version }}-fabric
          version: ${{ steps.versions.outputs.mod_version }}-fabric
          version-type: release
          changelog: Fabric 1.21.1. Client-only memory screen. Command /modsmemory.
          loaders: fabric
          environment: client
          game-versions: "1.21.1"
          java: "21"
          files: fabric/build/libs/modsmemoryviewer-fabric-1.21.1-${{ steps.versions.outputs.mod_version }}.jar
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}

      - name: Delete replaced Modrinth versions
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/replace-modrinth-versions.py --finish release-assets/modrinth-delete-after-publish.txt

      - name: Update Modrinth description
        if: steps.modrinth_token.outputs.present == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/update-modrinth-body.py mods-memory-viewer modrinth.md
