name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.7"
      - name: Build and test
        run: gradle build --stacktrace
      - name: Run unit tests
        run: gradle test --stacktrace
      - name: Set up JDK 21 for assets
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
      - name: Build 26.3
        working-directory: versions/26.3
        run: gradle build --stacktrace
