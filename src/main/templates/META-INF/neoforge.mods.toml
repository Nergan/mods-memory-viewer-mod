modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Nergan/mods-memory-viewer-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
displayURL = "https://github.com/Nergan/mods-memory-viewer-mod"
authors = "${mod_authors}"
description = '''
${mod_description}

Клиентский мод. Кнопка Mods открывает таблицу: сколько кучи сейчас приходится на классы из jar каждого мода.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "${kff_version_range}"
ordering = "NONE"
side = "CLIENT"
